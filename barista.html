<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3eb" />
  <title>Pedidos · Barista</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="barista-page">
  <div class="layout barista-layout">
    <header class="topbar">
      <div class="brand-lockup">
        <svg class="brand-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 20h24v10a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10V20Z"/><path d="M34 23h3a5 5 0 0 1 0 10h-3M6 43h34M17 14c-4-5 4-5 0-10m9 10c-4-5 4-5 0-10" stroke-linecap="round"/></svg>
        <div class="brand" id="brand">OS PEDRINHOS</div>
      </div>
    </header>
    <main>
      <section id="login-view" class="login-view">
        <h1>Barista</h1>
        <form id="login-form" class="login-form">
          <label for="email">E-mail</label>
          <input type="email" id="email" autocomplete="username" required />
          <label for="password">Senha</label>
          <input type="password" id="password" autocomplete="current-password" required />
          <button type="submit" class="primary-button" id="login-button"><span>Entrar</span><span aria-hidden="true">→</span></button>
        </form>
        <p id="login-error" class="form-error" role="alert"></p>
      </section>
      <section id="queue-view" hidden>
        <div class="dashboard-heading">
          <h1>Pedidos</h1>
          <div class="dashboard-controls">
            <button type="button" id="sound-button" class="secondary-button" aria-pressed="false">Ativar som</button>
            <button type="button" id="logout-button" class="text-button">Sair</button>
          </div>
        </div>
        <div id="admin-notice" class="notice" role="status">Buscando pedidos…</div>
        <div class="stats" aria-label="Resumo dos pedidos">
          <div class="stat"><span><i class="status-dot pending-dot"></i> Na fila</span><strong id="count-pending">0</strong></div>
          <div class="stat"><span><i class="status-dot preparing-dot"></i> Preparando</span><strong id="count-preparing">0</strong></div>
          <div class="stat"><span><i class="status-dot ready-dot"></i> Prontos</span><strong id="count-ready">0</strong></div>
        </div>
        <div class="queue-heading"><h2>Fila de pedidos</h2><span id="active-count">0 pedidos ativos</span></div>
        <div id="queue-error" class="form-error" role="alert" hidden></div>
        <div id="active-orders" class="orders-grid"></div>
        <div id="queue-empty" class="queue-empty" hidden><h3>Nenhum pedido</h3></div>
        <div class="completed-heading"><h2>Entregues</h2><button type="button" id="toggle-completed" class="text-button" aria-expanded="false" aria-controls="completed-orders">Mostrar</button></div>
        <div id="completed-orders" class="orders-grid" hidden></div>
      </section>
    </main>
  </div>
  <noscript><p class="noscript-message">Ative o JavaScript no navegador para acompanhar os pedidos.</p></noscript>
  <script type="module" src="./barista.js"></script>
</body>
</html>
